# FILE: frontend/nginx.conf
# Configuración de nginx para el frontend ACADEMIX.
#   - Sirve el build estático de Vite (SPA con fallback a index.html).
#   - Hace proxy de /api al backend (así no hay CORS en producción).
#   - Aplica cabeceras de seguridad y comprime la respuesta.
#
# ⚠️ GOTCHA de nginx que corrigió QA:
#   `add_header` NO es aditivo: si un bloque `location` declara CUALQUIER
#   `add_header` propio, deja de heredar TODAS las cabeceras del bloque
#   `server`. Como `location /` resuelve con `try_files ... /index.html`, la
#   petición se re-procesa contra `location = /index.html` — que declaraba
#   `add_header Cache-Control` y por tanto perdía en silencio
#   X-Content-Type-Options, X-Frame-Options, Referrer-Policy y la CSP.
#   Verificado: `GET /` devolvía únicamente Cache-Control.
#   Por eso las cabeceras de seguridad se repiten en CADA location que declara
#   las suyas (o se usa `include`, que es la otra salida válida).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Oculta la versión de nginx (menos información para un atacante).
    server_tokens off;

    # ---------- Compresión ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- Cabeceras de seguridad (nivel server) ----------
    # Content-Security-Policy endurecida:
    #   · script-src 'self'         -> sin scripts inline ni eval
    #   · style-src-attr            -> se permite el atributo style en línea
    #                                  (lo usan los estilos de la aplicación);
    #                                  los bloques <style> siguen restringidos
    #   · connect-src 'self'        -> la API se consume desde el mismo origen
    #   · frame-src / object-src    -> 'self' blob: para la previsualización de
    #                                  PDF (iframe con blob:). Sin esto la CSP
    #                                  bloquea el visor y el panel queda en blanco.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # 'unsafe-inline' SOLO en estilos. Es necesario porque los componentes de la
    # interfaz inyectan hojas de estilo en tiempo de ejecución; sin él el
    # navegador las descarta y el diseño pierde parte de su formato. El riesgo
    # es acotado: la inyección de CSS no puede ejecutar código. `script-src`
    # sigue siendo 'self' (sin inline ni eval), que es la protección que de
    # verdad importa frente a XSS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ---------- Healthcheck del contenedor ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        # Se repite la CSP/XCTO mínimo: este location declara su propio
        # add_header y por tanto no hereda los del server.
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "ok\n";
    }

    # ---------- Proxy al backend (red interna de docker-compose) ----------
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # ⚠️ BUG CRÍTICO que corrigió QA:
        #   El login devuelve 502 a través de nginx con este error en el log:
        #       upstream sent too big header while reading response header
        #   La respuesta de autenticación incluye DOS cookies JWT (accessToken
        #   + refreshToken, varios cientos de caracteres cada una) además de
        #   las cabeceras de seguridad de Helmet. El buffer por defecto de
        #   nginx para cabeceras (4k) no las admite, por lo que nginx cortaba
        #   la respuesta. Es decir: iniciar sesión NUNCA funcionaba a través
        #   del proxy. Se amplían los buffers a un tamaño holgado.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        client_max_body_size 20m;
        # Sin caché: son respuestas autenticadas y mutables.
        add_header Cache-Control "no-store" always;
    }

    # ---------- Health del backend expuesto en el mismo origen ----------
    # nginx solo publicaba /api y /healthz (su propio latido), de modo que
    # consultar /health/ready contra la URL pública devolvía el index.html de
    # la SPA en vez del estado real. Se hace proxy del health del backend para
    # poder comprobar «¿está la app viva y la base de datos conectada?» desde
    # el propio origen del despliegue (monitorización, balanceadores, QA).
    location /health/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Repetidas: este location declara add_header propio.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    # ---------- Assets con hash (inmutables) ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Repetidas: este location declara add_header propio.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri =404;
    }

    # ---------- index.html sin caché ----------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # Repetidas: este location declara add_header propio.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # ---------- SPA: fallback al router del cliente ----------
    # Nota: `try_files` re-despacha a `location = /index.html`, que repite su
    # propio juego de cabeceras (ver la explicación de arriba).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
